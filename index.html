<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Iron Log</title>

<!-- iOS home-screen app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111317">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ===================== WORKOUTS (HOME) ===================== -->
  <section id="view-home" class="view">
    <header class="top-bar">
      <h1 class="brand">Iron Log</h1>
    </header>
    <div id="home-list" class="scroll-area"></div>
    <button id="btn-new-session" class="fab" aria-label="New workout">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </section>

  <!-- ===================== TEMPLATE LIBRARY ===================== -->
  <section id="view-templates" class="view hidden">
    <header class="top-bar">
      <button class="icon-btn hidden" id="btn-templates-back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <h1 class="brand">Templates</h1>
    </header>
    <div id="templates-sub" class="session-meta"></div>
    <div id="templates-list" class="scroll-area"></div>
  </section>

  <!-- ===================== TEMPLATE DETAIL ===================== -->
  <section id="view-detail" class="view hidden">
    <header class="top-bar">
      <button class="icon-btn" id="btn-detail-back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <h1 class="page-title" id="detail-title"></h1>
    </header>
    <div id="detail-sub" class="session-meta"></div>
    <div id="detail-list" class="scroll-area"></div>
    <button id="btn-detail-primary" class="add-exercise-btn"></button>
  </section>

  <!-- ===================== STATS ===================== -->
  <section id="view-stats" class="view hidden">
    <header class="top-bar">
      <h1 class="brand">Stats</h1>
    </header>
    <div id="stats-content" class="scroll-area"></div>
  </section>

  <!-- ===================== ACTIVE SESSION ===================== -->
  <section id="view-session" class="view hidden">
    <header class="top-bar">
      <button class="icon-btn" id="btn-back-home" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <input id="session-name-input" class="session-name-input" placeholder="Workout name" />
      <button class="icon-btn danger" id="btn-delete-session" aria-label="Delete workout">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </header>

    <div class="session-meta" id="session-date"></div>
    <div id="exercise-list" class="scroll-area"></div>

    <div class="session-actions">
      <button id="btn-open-templates" class="btn-ghost">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1zM4 9h16M9 9v11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Templates
      </button>
      <button id="btn-add-exercise" class="add-exercise-btn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        Add exercise
      </button>
    </div>
  </section>

  <!-- ===================== TAB BAR ===================== -->
  <nav id="tabbar" class="tabbar">
    <button class="tab" data-tab="workouts">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 12h2m14 0h2M7 7v10M17 7v10M5 9v6M19 9v6M7 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>Workouts</span>
    </button>
    <button class="tab" data-tab="templates">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1zM4 9h16M9 9v11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>Templates</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 20V12M12 20V5M19 20v-9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>Stats</span>
    </button>
  </nav>

</div>

<!-- Add-exercise sheet -->
<div id="sheet-backdrop" class="sheet-backdrop hidden">
  <div class="sheet" id="exercise-sheet">
    <div class="sheet-handle"></div>
    <h3>Exercise name</h3>
    <input id="exercise-name-input" class="sheet-input" list="exercise-suggestions" placeholder="e.g. Bench Press" autocomplete="off" />
    <datalist id="exercise-suggestions"></datalist>
    <h3>Muscle group</h3>
    <div id="group-chips" class="chips"></div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="btn-cancel-exercise">Cancel</button>
      <button class="btn-primary" id="btn-save-exercise">Add</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="catalog.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>
</body>
</html>
